[package]
name = "mesh"
version = "0.2.0"
edition = "2021"
rust-version = "1.94"
description = "A mesh for multi-agent collaboration over a single Markdown folder"
license = "MIT"
publish = false

[lib]
name = "mesh"
path = "src/lib.rs"

[[bin]]
name = "mesh"
path = "src/main.rs"

[[bin]]
name = "mesh-mcp"
path = "src/bin/mesh-mcp.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4.5", features = ["derive", "env", "wrap_help", "string"] }
clap_complete = "4.5"
dirs = "6"
indexmap = { version = "2", features = ["serde"] }
notify = "8"
notify-debouncer-full = "0.6"
rustix = { version = "1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
toml = "0.9"
toml_edit = "0.23"
walkdir = "2"
which = "7"
yaml-rust2 = "0.10"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serial_test = "3"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
