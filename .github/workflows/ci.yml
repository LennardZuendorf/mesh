name: CI

# Gate-for-gate successor to the Python workflow:
#   uv sync --locked      -> cargo ... --locked (Cargo.lock is committed and must be current)
#   ruff check            -> cargo clippy -D warnings
#   ruff format --check   -> cargo fmt --all -- --check
#   ty check              -> the compiler
#   pytest --cov          -> cargo llvm-cov --fail-under-lines (ratchets up, never down)
#   wheel smoke job       -> a release build that runs the real binaries
#
# The toolchain is pinned by rust-toolchain.toml; no toolchain version is named here, so
# bumping the pin is a one-file change.
#
# `mesh-mcp` is a stdio server that blocks on stdin by design — never `--help` it. The
# package job checks the binary exists, and drives `mesh mcp` with a real `initialize`
# line under a timeout instead.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Show the pinned toolchain
        run: rustc --version && cargo --version

      - name: Format (cargo fmt --check)
        run: cargo fmt --all -- --check

      - name: Lint (clippy, warnings are errors)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # 80 % lines. Rust encodes in the type system many of the defensive branches the
      # Python suite covered with tests, so the floor is lower than the old 97 % — but it
      # ratchets up, never down. Never lower this without a coverage regression backing it.
      - name: Coverage floor
        run: cargo llvm-cov --locked --fail-under-lines 80

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Release build
        run: cargo build --release --locked

      - name: Smoke the `mesh` binary
        run: |
          ./target/release/mesh --version
          ./target/release/mesh --help

      # EXISTENCE ONLY — mesh-mcp boots the stdio server and blocks on stdin.
      - name: The `mesh-mcp` binary exists and is executable
        run: test -x ./target/release/mesh-mcp

      - name: Shell completions generate
        run: ./target/release/mesh completions bash > /dev/null

      # Drive the stdio MCP server rather than --help-ing it.
      - name: The MCP server answers `initialize`
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            | timeout 5 ./target/release/mesh mcp | head -1 | grep -q '"serverInfo"'

      - name: Verb smoke test
        run: ./scripts/smoke.sh
