name: CI

# Minimal gate for cli-toolset-rework/2: lint, type-check, tests, and the
# startup-time regression guard. Unit 5 extends this (ruff format, spec
# test-count check) — keep additions non-conflicting with this job.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (ty)
        run: uv run ty check src/

      - name: Test (pytest)
        run: uv run pytest -q

      - name: Startup guard (heavy deps off the CLI fast path)
        run: uv run pytest tests/test_startup_guard.py -q
