[project]
name = "shards"
version = "0.1.0"
description = "A mesh for multi-agent collaboration over one Markdown folder — note, task, search."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lennard Zundorf" }]
dependencies = [
    "typer>=0.12",
    "python-frontmatter>=1.1",
    "msgspec>=0.18",
    "watchdog>=4.0",
    "fastmcp>=2.0",
]

[project.scripts]
shards = "shards.cli.__main__:app"
shards-mcp = "shards.mcp.server:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "ty>=0.0.60",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shards"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.11"
root = ["src", "."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["src/shards"]

[tool.coverage.report]
# Measured at core-hardening/7: 98.17-98.20% (3053-3052/3109 stmts, timing-
# sensitive watcher branch). Floored ~1.2pt below the observed range, per
# .spec/features/core-hardening/plan.md's own recommendation ("measured minus
# 1 point, ratcheted upward only") — never lower this without a coverage
# regression backing it, and always ratchet it up as coverage genuinely grows.
fail_under = 97
