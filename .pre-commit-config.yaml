# Local hooks only: every check shells out to the repo's own cargo toolchain (pinned by
# rust-toolchain.toml), so pre-commit never manages an isolated tool environment — it just
# gates the same three commands CI runs.
#
#   pre-commit install
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        types: [rust]

      - id: cargo-clippy
        name: cargo clippy -D warnings
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        pass_filenames: false
        types: [rust]
        require_serial: true

      - id: cargo-test
        name: cargo test
        entry: cargo test
        language: system
        pass_filenames: false
        types: [rust]
        require_serial: true
