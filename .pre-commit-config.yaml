# Local hooks only: every check shells out to the project's own `uv run` tools
# (AGENTS.md § "never pip/venv directly"), so pre-commit never manages its own
# isolated tool environments — it just gates the same commands CI runs.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        require_serial: true

      - id: ty
        name: ty check (src + tests)
        entry: uv run ty check src/ tests/
        language: system
        pass_filenames: false
        types: [python]
