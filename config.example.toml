# mesh config — reference copy.
#
# `config.toml` itself is gitignored (it names a real vault path and identity),
# so this committed example is the shape every key comes in. It documents every
# field `src/config.rs` reads and loads cleanly as-is — asserted by
# `tests/bundle.rs::the_example_config_loads_through_from_table`, so it cannot
# silently rot.
#
# Fastest way to get a real one: `mesh init` (writes `~/.mesh/config.toml`, or
# `$MESH_CONFIG_PATH` when set). This file is the reference, not a template to
# copy by hand — `init` also creates the vault directory and expands `~`.
#
# Unknown tables and keys are ignored, never rejected, so a fleet mid-upgrade
# keeps working and a leftover `[daemon]` table from mesh 0.1.0 is inert.

[core]
# Path to your Markdown vault folder — any directory mesh can write into. `~` is
# expanded at load and the result is canonicalised (made absolute, symlinks
# followed) so the CLI, `mesh watch` and the sandbox all speak one path space.
# The folder need not exist yet — `mesh init` creates it, and each space folder
# is created lazily on its first write. `path` and `tolaria_path` are still
# accepted as legacy input spellings (precedence: vault_path > path >
# tolaria_path). `--vault` and `$MESH_VAULT` override this key, in that order.
#
# Mesh's own reads and writes stay inside the enabled space roots below — an
# existing Markdown vault root works as-is, and dot-directories such as
# `.obsidian/`, `.git/` and `.trash/` are never walked. But if
# `[search].collection` is set, `mesh reindex` hands this whole path to
# `indexed index create`, which ingests everything under it. Point this at a
# dedicated folder (or a subfolder of a bigger vault) if you don't want
# unrelated files indexed.
vault_path = "~/mesh-vault"

# This agent's default identity. Used as the default `owner` on every write and
# as the implicit claimer for `task claim` / `task release` / `session-start`,
# and as the scratch namespace. Optional — `$MESH_AGENT` may supply it instead
# and always wins over this key when both are set and non-empty. Commands that
# need an identity fail with a clear message when neither is set.
agent = "my-agent"

[spaces]
# The five spaces. This whole table is optional, and so is every key in it:
# omitting it reproduces the pre-rewrite layout exactly, so a mesh 0.1.0 config
# behaves identically with zero edits.
#
# Each value is one of:
#   "subdir"     a path relative to vault_path
#   "/abs/path"  an absolute folder (~-expanded); joins the sandbox explicitly
#   "."  or ""   the vault root itself
#   false        the space is disabled — every verb for it exits 2, and it
#                contributes no sandbox root and no search corpus
#
# Validated at load, all exit 2 before any I/O: two enabled spaces may not
# resolve to the same directory; when the notes space IS the vault root every
# other enabled root must be a strict descendant (and is then skipped by the
# notes walk, so `mesh note list` never lists your tasks); a relative root may
# not resolve outside vault_path.
#
# Type and status routing is always relative to the SPACE root, never to
# vault_path: with `notes = "."`, `note new --type log` lands in <vault>/logs/.
# `mesh init --obsidian` is shorthand for exactly that.
notes = "notes"
tasks = "tasks"
memories = "memories"
scratch = "scratch"
assets = "assets"

[search]
# The `indexed` collection name this vault is registered under. Optional —
# leave it unset and `indexed` is never invoked at all: search uses the
# built-in engine and `mesh reindex` is a silent no-op.
collection = "my-vault"

# Whether `mesh search` asks `indexed` for hybrid lexical+vector ranking.
# When false, or when the `indexed` binary is unavailable, or when it fails or
# exceeds its 30 s wall clock, search degrades to the built-in engine with one
# stderr notice — never an error. Default: true.
hybrid = true

# Minimum score to keep a hit. Deliberately left commented out — and `mesh init`
# omits it too. It applies *only* when set explicitly here (or passed as
# `search --threshold`); with it unset the built-in engine keeps its own 0.4
# floor, so tag matches (0.6) and body matches (0.4) still come back. Setting it
# to the nominal 0.65 makes both tiers unreachable, which is body search
# switched off. Set it only if you want that cutoff.
# threshold = 0.65

# Default ranking engine: auto | indexed | builtin | substring.
#   auto      indexed when hybrid is on, a collection is set and the binary is
#             on PATH; otherwise the built-in engine (the default)
#   indexed   take the indexed branch even with hybrid = false
#   builtin   BM25-lite, with the four legacy tiers kept as score floors
#   substring the legacy scoring and head-of-body snippets, byte-for-byte
engine = "auto"

# The default search corpus. `search --space CSV` overrides it per call.
# Scratch is deliberately absent: it is a workbench, not memory, and is opt-in.
spaces = ["notes", "tasks", "memories", "assets"]

[tasks]
# The roster of identities `--owner` (CLI) / `owner` (MCP) may take on writes in
# every space — a spelling/value check, not a check on who is actually calling
# (nothing verifies that). Leave empty (`[]`) for an open roster where any owner
# string is accepted; that is also the default when the key is omitted.
collections = ["my-agent", "another-agent"]

# The default for `task claim --strict`: refuse to claim a task with an
# unsatisfied blocker (exit 5, writing nothing) instead of claiming it with a
# stderr advisory. `--strict` / `--no-strict` override this per call.
strict = false
