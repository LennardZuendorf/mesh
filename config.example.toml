# shards config — reference copy.
#
# `config.toml` itself is gitignored (it names a real vault path and identity),
# so this committed example is the shape every key comes in. It documents
# every field `src/shards/schemas/config.py` defines and loads cleanly as-is
# (see `tests/cli/test_init.py::test_example_config_loads` — it is asserted
# against `load_config`, so it cannot silently rot).
#
# Fastest way to get a real one: `shards init` (writes `~/.shards/config.toml`,
# or `$SHARDS_CONFIG_PATH` when set). This file is the reference, not a
# template to copy by hand — `init` also creates the vault directory and
# expands `~` for you.

[core]
# Path to your Tolaria Markdown vault folder — the one folder shards reads and
# writes (notes/, tasks/). Required; no default. A leading `~` is expanded at
# load time, so `~/vault` and `/home/you/vault` are equivalent.
tolaria_path = "~/shards-vault"

# This agent's default identity. Used as the default `owner` on note/task
# creation and as the implicit claimer for `task claim` / `task release` /
# `session-start` when no explicit identity is passed. Optional — if unset,
# `$SHARDS_AGENT` may still supply it at load time (the environment variable
# always wins over this key when both are present). Commands that need an
# identity (task_claim, task creation with no --owner) fail with a clear
# message if neither is set.
agent = "my-agent"

[search]
# The `indexed` collection name this vault is registered under. Optional —
# leave unset to use indexed's own default collection resolution.
collection = "my-vault"

# Whether `shards search` asks `indexed` for hybrid lexical+vector ranking.
# When false, or when the `indexed` binary is unavailable, search degrades to
# a built-in substring scan over frontmatter + body. Default: true.
hybrid = true

# Minimum indexed score to keep a hit as "hybrid" quality; below this the
# result is reported as a fallback-quality match. Only applies when a caller
# sets it explicitly here — default: 0.65.
threshold = 0.65

[tasks]
# The roster of identities `--owner` (CLI) / `owner` (MCP) is allowed to take
# on task and note writes — a spelling/value check, not an authorization
# check (nothing verifies who is actually calling). Leave empty (`[]`) for an
# open roster where any owner string is accepted; that is also the default
# when this key is omitted entirely.
collections = ["my-agent", "another-agent"]
